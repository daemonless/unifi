icon: ':simple-ubiquiti:'
cit:
  mode: port
  port: 8443
  https: true
  wait: 300
  annotations:
    - org.freebsd.jail.allow.mlock=true

build:
  architectures:
    - amd64
    - aarch64
  variants:
    - tag: latest
      containerfile: Containerfile
      default: true
      # mongodb70 failed in the 15.1 quarterly package run (2026-10-22) and
      # dropped out of that repo; the latest repo has it.
      args:
        BASE_VERSION: "15.1-latest"
    # pkg is an alias of pkg-latest until the 15.1 quarterly repo has unifi10
    # again: mongodb70 failed in the 2026-10-22 package run, which skipped
    # unifi10, and a failed variant blocks the manifests for the other tags.
    - tag: pkg-latest
      containerfile: Containerfile.pkg
      aliases: ["pkg"]
      args:
        BASE_VERSION: "15.1-latest"
